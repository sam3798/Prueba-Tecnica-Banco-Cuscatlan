app:
  database:
    url: jdbc:h2:mem:coworking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jwt:
    secret: "coworking-test-secret-key-must-be-long-enough-256bits"
    expiration-ms: 3600000
  payment:
    force-failure: false
    simulated-delay-ms: 0

spring:
  cache:
    type: caffeine
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
