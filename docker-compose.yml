services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    environment:
      POSTGRES_DB: coworking
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: coworking-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/coworking
      DB_USERNAME: coworking
      DB_PASSWORD: coworking
      JWT_SECRET: coworking-prod-secret-key-must-be-long-enough-256bits
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data:
