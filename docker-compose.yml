services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    environment:
      POSTGRES_DB: coworking
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
